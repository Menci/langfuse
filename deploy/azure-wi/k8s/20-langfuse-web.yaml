apiVersion: v1
kind: Service
metadata:
  name: langfuse-web
  namespace: langfuse
spec:
  selector:
    app: langfuse-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  namespace: langfuse
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: langfuse-web
  template:
    metadata:
      labels:
        app: langfuse-web
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: langfuse-workload-sa
      containers:
        - name: web
          image: societasdev.azurecr.io/langfuse/web:a80eed37e
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: langfuse-env
            - secretRef:
                name: langfuse-app-secrets
          env:
            # Public URL as reached by the browser after Front Door + private
            # link. next-auth uses this to validate the OAuth callback origin;
            # a mismatch produces AADSTS9002327 / CORS-style errors.
            - name: NEXTAUTH_URL
              value: "https://societas-evaluation-langfuse-apg5f2bgdjd9gbb8.b02.azurefd.net"
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /api/public/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langfuse-web
  namespace: langfuse
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: langfuse-web
                port:
                  number: 3000
