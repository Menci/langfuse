# Template for langfuse app secrets. Kubernetes Secret manifests are safe
# to commit ONLY if they contain placeholder values; this file uses envsubst
# placeholders. Replace the values via one of:
#
#   1. Direct kubectl (quick, dev):
#      envsubst < 01-app-secret.template.yaml | kubectl apply -f -
#
#   2. Azure Key Vault CSI driver (production; requires KV + SecretProviderClass
#      per key). AKS azureKeyvaultSecretsProvider addon is already enabled.
#
# Values to fill:
#   ENCRYPTION_KEY               — hex(32); `openssl rand -hex 32`
#   NEXTAUTH_SECRET              — base64(32); `openssl rand -base64 32`
#   SALT                         — 32 chars; `openssl rand -base64 24`
#   CLICKHOUSE_PASSWORD          — alphanumeric only (avoids URL-encoding pain
#                                  in CLICKHOUSE_MIGRATION_URL); `openssl rand
#                                  -hex 24`
#   AUTH_AZURE_AD_CLIENT_SECRET  — placeholder is fine, we run the AAD app in
#                                  "public client + PKCE" mode. Anything
#                                  non-empty satisfies auth.ts's gate.
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-app-secrets
  namespace: langfuse
type: Opaque
stringData:
  ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
  NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
  SALT: "${SALT}"
  CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
  AUTH_AZURE_AD_CLIENT_SECRET: "unused-pkce-no-secret"
